[project]
name = "maple-discord"
version = "0.2.0"
description = "Discord gateway to the same Maple (ADR-0032). Holds the bot token; Maplegotchi never does."
requires-python = ">=3.12,<3.13"
dependencies = [
    "discord.py>=2.4,<3",
    "httpx>=0.27,<1",
]

[project.scripts]
maple-discord = "maple_discord.__main__:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maple_discord"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
