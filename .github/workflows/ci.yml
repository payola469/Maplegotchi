name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Production is Linux (paolo-core); development happens on Windows.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: "ruff (stdlib deploy tools: survey, backup staging, verification)"
        run: |
          uv run ruff check --config pyproject.toml ../deploy/survey ../deploy/backup ../deploy/verify
          uv run ruff format --check --config pyproject.toml ../deploy/survey ../deploy/backup ../deploy/verify
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest

  shell:
    name: shellcheck (deploy + scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh deploy/install/*.sh deploy/verify/*.sh deploy/backup/*.sh
      - run: shellcheck -s bash -e SC2034 deploy/backup/maple-block.bash  # sourced text; its variable is used by the host script
      - run: shellcheck scripts/*.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
