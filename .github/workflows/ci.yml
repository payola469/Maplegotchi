name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Production is Linux (paolo-core); development happens on Windows.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: "v11 structural validation: linked SQLite evidence"
        run: |
          uv run --no-sync python -B - <<'PY'
          import sqlite3
          import sys
          from contextlib import closing

          print(f"Python executable: {sys.executable}")
          print(f"Python version: {sys.version}")
          print(f"sqlite3.sqlite_version: {sqlite3.sqlite_version}")
          print(f"sqlite3.sqlite_version_info: {sqlite3.sqlite_version_info}")

          if sqlite3.sqlite_version_info < (3, 41, 0):
              raise SystemExit(
                  "v11 structural validation requires SQLite >=3.41.0"
              )

          try:
              with closing(sqlite3.connect(":memory:")) as conn:
                  result = conn.execute("SELECT unhex('4D61706C65')").fetchone()
          except sqlite3.Error as exc:
              raise SystemExit(f"v11 unhex() probe failed: {exc}") from exc

          if result != (b"Maple",):
              raise SystemExit("v11 unhex() probe returned an unexpected result")

          print("v11 SQLite >=3.41.0 and unhex() probe: PASS")
          PY
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: "ruff (stdlib deploy tools: survey, backup staging, verification)"
        run: |
          uv run ruff check --config pyproject.toml ../deploy/survey ../deploy/backup ../deploy/verify
          uv run ruff format --check --config pyproject.toml ../deploy/survey ../deploy/backup ../deploy/verify
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest
      - name: "Synthetic canonical life diagnostic evidence (not a D05 pin)"
        env:
          LIFE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LIFE_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          uv run --no-sync python -B -m tests.schema_v11.life_evidence \
            --output "$RUNNER_TEMP/maple-life-evidence.json" \
            --source-sha "$LIFE_SOURCE_SHA" --checkout-sha "$LIFE_CHECKOUT_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-life-${{ matrix.os }}
          path: ${{ runner.temp }}/maple-life-evidence.json
          if-no-files-found: error
          retention-days: 1

  shell:
    name: shellcheck (deploy + scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh deploy/install/*.sh deploy/verify/*.sh deploy/backup/*.sh
      - run: shellcheck -s bash -e SC2034 deploy/backup/maple-block.bash  # sourced text; its variable is used by the host script
      - run: shellcheck scripts/*.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Hash and stage actual Linux atlas outputs
        run: pnpm assets:manifest --revision "${{ github.sha }}" --output ../var/atlas-linux
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-linux
          path: var/atlas-linux/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  art-windows:
    name: art reproducibility (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Reproduce PNG, metadata and generated-index hashes
        run: pnpm assets:test
      - name: Build and verify processed atlas bundle
        run: pnpm build
      - name: Hash and stage actual Windows atlas outputs
        run: pnpm assets:manifest --revision "${{ github.sha }}" --output ../var/atlas-windows
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-windows
          path: var/atlas-windows/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  companions:
    name: companion (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [discord, brain]
    defaults:
      run:
        working-directory: companion/${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  art-compare:
    name: atlas byte equality (Linux vs Windows)
    needs: [frontend, art-windows, backend]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful producers
        env:
          LINUX_RESULT: ${{ needs.frontend.result }}
          WINDOWS_RESULT: ${{ needs.art-windows.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: test "$LINUX_RESULT" = success && test "$WINDOWS_RESULT" = success && test "$BACKEND_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: atlas-linux
          path: var/artifacts/linux
      - uses: actions/download-artifact@v4
        with:
          name: atlas-windows
          path: var/artifacts/windows
      - name: Rehash actual files and compare all generated outputs
        run: node frontend/tools/art/reproducibility.mjs compare var/artifacts/windows var/artifacts/linux

      - uses: actions/download-artifact@v4
        with:
          name: canonical-life-ubuntu-latest
          path: var/artifacts/life-linux
      - uses: actions/download-artifact@v4
        with:
          name: canonical-life-windows-latest
          path: var/artifacts/life-windows
      - name: Compare independently produced canonical life diagnostics (D05 remains OPEN)
        run: >-
          python3 backend/tests/schema_v11/life_evidence.py --compare
          var/artifacts/life-linux/maple-life-evidence.json
          var/artifacts/life-windows/maple-life-evidence.json
